<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>数据结构选择题 · 完整1-111题（含图表）</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f5f7fb;
            transition: background 0.2s, color 0.2s;
            padding: 0 12px 80px 12px;
            min-height: 100vh;
        }

        :root {
            --bg: #f5f7fb;
            --card-bg: #ffffff;
            --text: #1e2a3e;
            --text-secondary: #334e68;
            --border: #e2e8f0;
            --option-bg: #f1f5f9;
            --option-hover: #e2e8f0;
            --correct: #10b981;
            --wrong: #ef4444;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body.dark {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #e2e8f0;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --option-bg: #334155;
            --option-hover: #475569;
            --correct: #34d399;
            --wrong: #f87171;
            --primary: #60a5fa;
            --primary-dark: #3b82f6;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .stats-bar {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            border-radius: 28px;
            padding: 10px 18px;
            margin: 12px 0 16px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            font-weight: 500;
            z-index: 10;
        }

        .stat-item {
            background: var(--option-bg);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: var(--text);
        }

        .stat-number {
            font-weight: 700;
            margin-left: 6px;
            color: var(--primary);
        }

        .timer {
            font-family: monospace;
            letter-spacing: 1px;
        }

        .quiz-container {
            max-width: 650px;
            margin: 0 auto;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 24px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .question-text {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
            margin-bottom: 20px;
            word-break: break-word;
        }

        .graph-container {
            background: var(--option-bg);
            border-radius: 20px;
            padding: 15px;
            margin: 15px 0;
            overflow-x: auto;
            font-size: 0.9rem;
        }
        .matrix-table {
            border-collapse: collapse;
            width: 100%;
            text-align: center;
        }
        .matrix-table th, .matrix-table td {
            border: 1px solid var(--border);
            padding: 6px 8px;
            min-width: 40px;
        }
        .adj-list {
            background: var(--card-bg);
            padding: 10px;
            border-radius: 16px;
            font-family: monospace;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-item {
            background: var(--option-bg);
            border-radius: 60px;
            padding: 12px 18px;
            font-size: 1rem;
            border: 1px solid transparent;
            transition: all 0.2s;
            cursor: pointer;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-prefix {
            font-weight: 700;
            background: var(--card-bg);
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .option-item.correct-highlight {
            background: var(--correct);
            color: white;
            border-color: var(--correct);
        }
        .option-item.correct-highlight .option-prefix {
            background: rgba(255,255,255,0.3);
            color: white;
        }
        .option-item.wrong-highlight {
            background: var(--wrong);
            color: white;
            border-color: var(--wrong);
        }
        .option-item.wrong-highlight .option-prefix {
            background: rgba(255,255,255,0.3);
            color: white;
        }

        .explanation-area {
            background: var(--option-bg);
            border-radius: 24px;
            padding: 14px 18px;
            margin-top: 12px;
            border-left: 4px solid var(--primary);
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        .explanation-title {
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--primary);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .nav-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 14px 0;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            color: var(--text);
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            box-shadow: var(--shadow);
        }
        .nav-btn:active { transform: scale(0.97);}
        .nav-btn:hover { background: var(--option-hover);}
        
        .fab-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 20;
        }
        .fab-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 56px;
            height: 56px;
            border-radius: 56px;
            font-size: 1.4rem;
            font-weight: bold;
            box-shadow: 0 6px 14px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .fab-btn:active { transform: scale(0.94);}

        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-mask.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-content {
            background: var(--card-bg);
            width: 90%;
            max-width: 500px;
            max-height: 70%;
            border-radius: 40px;
            padding: 20px;
            border: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .modal-header {
            font-weight: 700;
            font-size: 1.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .close-modal {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text);
        }
        .question-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(55px, 1fr));
            gap: 12px;
        }
        .grid-item {
            text-align: center;
            padding: 10px 0;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            border: 1px solid var(--border);
            background: #f8fafc;
            color: #1e293b;
        }
        body.dark .grid-item {
            background: #334155;
            color: #e2e8f0;
        }
        .grid-item.correct-status {
            background: var(--correct);
            color: white;
            border-color: var(--correct);
        }
        .grid-item.wrong-status {
            background: var(--wrong);
            color: white;
            border-color: var(--wrong);
        }
        .grid-item.unanswered-status {
            background: #e2e8f0;
            color: #1e293b;
        }
        body.dark .grid-item.unanswered-status {
            background: #475569;
            color: #f1f5f9;
        }
        .grid-item.current {
            outline: 3px solid var(--primary);
            transform: scale(1.02);
        }

        .dark-toggle {
            background: var(--option-bg);
            border: none;
            border-radius: 40px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text);
            transition: 0.1s;
        }

        .question-progress {
            font-size: 0.8rem;
            background: var(--option-bg);
            padding: 6px 12px;
            border-radius: 60px;
            color: var(--text);
        }
        @media (max-width: 500px) {
            .question-text { font-size: 1.2rem; }
            .stats-bar { flex-wrap: wrap; justify-content: center; }
            .option-item { padding: 10px 14px; }
        }
    </style>
</head>
<body>
<div class="quiz-container">
    <div class="stats-bar">
        <div class="stat-item">📋 已刷 <span id="answeredCount">0</span>/<span id="totalCount">111</span></div>
        <div class="stat-item">✅ 正确 <span id="correctCount">0</span></div>
        <div class="stat-item">❌ 错误 <span id="wrongCount">0</span></div>
        <div class="stat-item timer">⏱️ <span id="timerDisplay">00:00</span></div>
        <button class="dark-toggle" id="darkModeToggle">🌙 黑夜</button>
    </div>

    <div class="question-card">
        <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
            <span class="question-progress" id="qIndexLabel">第1 / 111题</span>
        </div>
        <div class="question-text" id="questionText">加载中...</div>
        <div id="graphContainer" class="graph-container" style="display: none;"></div>
        <div class="options-list" id="optionsContainer"></div>
        <div id="explanationBox" class="explanation-area" style="display: none;"></div>
    </div>

    <div class="nav-buttons">
        <div class="nav-btn" id="prevBtn">◀ 上一题</div>
        <div class="nav-btn" id="nextBtn">下一题 ▶</div>
    </div>
</div>

<div class="fab-container">
    <button class="fab-btn" id="jumpBtn">📋</button>
    <button class="fab-btn" id="submitBtn">✓</button>
</div>

<div id="jumpModal" class="modal-mask">
    <div class="modal-content">
        <div class="modal-header">
            <span>📖 题目跳转</span>
            <button class="close-modal" id="closeModalBtn">&times;</button>
        </div>
        <div class="question-grid" id="questionGrid"></div>
    </div>
</div>

<script>
    // ======================= 完整1-111题数据 =======================
    const QUESTIONS = [];
    const extraGraphs = {};

    function add(id, text, options, correctLetter, explanation, graphHtml = null) {
        QUESTIONS.push({ id, text, options, correct: correctLetter, explanation });
        if (graphHtml) extraGraphs[id] = graphHtml;
    }

    function extractOptionText(optStr) {
        let match = optStr.match(/^[A-D][.\s、]*/);
        if (match) return optStr.substring(match[0].length).trim();
        return optStr;
    }

    // 绪论 1-6
    add(1,"在数据结构中，从逻辑上可以把数据结构分成（ ）。",["A. 动态结构和静态结构","B. 紧凑结构和非紧凑结构","C. 线性结构和非线性结构","D. 内部结构和外部结构"],"C","逻辑结构分为线性与非线性。");
    add(2,"与数据元素本身的形式、内容、相对位置、个数无关的是数据的（ ）。",["A. 存储结构","B. 存储实现","C. 逻辑结构","D. 运算实现"],"C","逻辑结构抽象无关具体存储。");
    add(3,"通常要求同一逻辑结构中的所有数据元素具有相同的特性，这意味着（ ）。",["A. 数据具有同一特点","B. 不仅数据元素所包含的数据项的个数要相同，而且对应数据项的类型要一致","C. 每个数据元素都一样","D. 数据元素所包含的数据项的个数要相等"],"B","数据项结构一致。");
    add(4,"以下说法正确的是（ ）。",["A. 数据元素是数据的最小单位","B. 数据项是数据的基本单位","C. 数据结构是带有结构的各数据项的集合","D. 一些表面上很不相同的数据可以有相同的逻辑结构"],"D","如树形结构可以表示不同场景。");
    add(5,"算法的时间复杂度取决于（ ）。",["A. 问题的规模","B. 待处理数据的初态","C. 计算机的配置","D. A和B"],"D","规模和初态。");
    add(6,"以下数据结构中，（ ）是非线性数据结构。",["A. 树","B. 字符串","C. 队列","D. 栈"],"A","树是非线性结构。");

    // 线性表 7-21
    add(7,"顺序表中第一个元素的存储地址是100，每个元素的长度为2，则第5个元素的地址是（ ）。",["A. 110","B. 108","C. 100","D. 120"],"B","100+4*2=108");
    add(8,"在含n个结点的顺序表中，算法的时间复杂度是O(1)的操作是（ ）。",["A. 访问第i个结点和求第i个结点的直接前驱","B. 在第i个结点后插入一个新结点","C. 删除第i个结点","D. 将n个结点从小到大排序"],"A","随机存取O(1)。");
    add(9,"在一个有127个元素的顺序表中插入一个新元素并保持原来顺序不变，平均要移动的元素个数为（ ）。",["A. 8","B. 63.5","C. 63","D. 7"],"C","平均移动n/2≈63.5 取整63。");
    add(10,"链接存储的存储结构所占存储空间（ ）。",["A. 分为两部分，一部分存放结点值，另一部分存放表示结点间关系的指针","B. 只有一部分，存放结点值","C. 只有一部分，存放表示结点间关系的指针","D. 分为两部分，一部分存放结点值，另一部分存放结点所占单元数"],"A","节点包含数据域和指针域。");
    add(11,"线性表若采用链式存储结构，要求内存中可用存储单元的地址（ ）。",["A. 必须是连续的","B. 部分地址必须是连续的","C. 一定是不连续的","D. 连续或不连续都可以"],"D","链表不要求连续。");
    add(12,"线性表L在（ ）情况下适用于使用链式结构实现。",["A. 需经常修改L中的结点值","B. 需不断对L进行删除、插入","C. L中含有大量的结点","D. L中结点结构复杂"],"B","频繁插入删除适合链表。");
    add(13,"单链表的存储密度（ ）。",["A. 大于1","B. 等于1","C. 小于1","D. 不能确定"],"C","指针占用空间，密度<1。");
    add(14,"将两个各有n个元素的有序表归并成一个有序表，其最少的比较次数是（ ）。",["A. n","B. 2n-1","C. 2n","D. n-1"],"A","一个表完全小于另一个只需n次。");
    add(15,"在一个长度为n的顺序表中，在第i个元素（1≤i≤n+1）之前插入一个新元素时需向后移动（ ）个元素。",["A. n-i","B. n-i+1","C. n-i-1","D. i"],"B","移动n-i+1个元素。");
    add(16,"线性表L=(a1,a2,…,an)，下列陈述正确的是（ ）。",["A. 每个元素都有一个直接前驱和一个直接后继","B. 线性表中至少有一个元素","C. 表中诸元素的排列必须是由小到大或由大到小的","D. 除第一个和最后一个元素外，其余每个元素都有一个且仅有一个直接前驱和直接后继"],"D","线性表特点。");
    add(17,"创建一个包括n个结点的有序单链表的时间复杂度是（ ）。",["A. O(1)","B. O(n)","C. O(n^2)","D. O(n log n)"],"C","每次插入需查找O(n^2)。");
    add(18,"以下陈述错误的是（ ）。",["A. 求表长、定位这两种运算在采用顺序存储结构时实现的效率不比采用链式存储结构时实现的效率低","B. 顺序存储的线性表可以随机存取","C. 由于顺序存储要求连续的存储区域，因此在存储管理上不够灵活","D. 线性表的链式存储结构优于顺序存储结构"],"D","各有优劣。");
    add(19,"在单链表中，要将s所指结点插入p所指结点之后，其语句应为（ ）。",["A. s->next = p+1; p->next = s;","B. (*p).next = s; (*s).next = (*p).next;","C. s->next = p->next; p->next = s->next;","D. s->next = p->next; p->next = s;"],"D","标准插入。");
    add(20,"在双向链表存储结构中，删除p所指结点时修改指针的操作为（ ）。",["A. p->next->prior = p->prior; p->prior->next = p->next;","B. p->next = p->next->next; p->next->prior = p;","C. p->prior->next = p; p->prior = p->prior->prior;","D. p->prior = p->next->next; p->next = p->prior->prior;"],"A","双向链表删除。");
    add(21,"在双向循环链表中，在p指针所指的结点后插入q所指向的新结点，其修改指针的操作是（ ）。",["A. p->next = q; q->prior = p; p->next->prior = q; q->next = q;","B. p->next = q; p->next->prior = q; q->prior = p; q->next = p->next;","C. q->prior = p; q->next = p->next; p->next->prior = q; p->next = q;","D. q->prior = p; q->next = p->next; p->next = q; p->next->prior = q;"],"C","正确顺序。");

    // 栈队列 22-36
    add(22,"若让元素1,2,3,4,5依次进栈，出栈次序不可能出现（ ）。",["A. 5,4,3,2,1","B. 2,1,5,4,3","C. 4,3,1,2,5","D. 2,3,5,4,1"],"C","4,3,1,2,5 中1出栈时2还在栈中，不可能。");
    add(23,"若已知一个栈的入栈序列是1,2,3,...,n，其输出序列为p1,p2,...,pn，若p1=n，则pi为（ ）。",["A. i","B. n-i","C. n-i+1","D. 不确定"],"C","p1=n则输出逆序，pi=n-i+1。");
    add(24,"一个循环队列，f为当前队列头元素的前一位置，r为队尾元素的位置，假定队列中元素的个数小于n，计算队列中元素个数的公式为（ ）。",["A. r-f","B. (n+f-r)%n","C. n+r-f","D. (n+r-f)%n"],"D","循环队列长度公式。");
    add(25,"链式栈结点为(data,link)，top指向栈顶，若想删除栈顶结点，并将删除结点的值保存到x中，则应执行操作（ ）。",["A. x=top->data; top=top->link;","B. top=top->link; x=top->link;","C. x=top; top=top->link;","D. x=top->link;"],"A","标准出栈。");
    add(26,"递归函数fact(n)调用次数为（ ）。",["A. n+1","B. n-1","C. n","D. n+2"],"A","n+1次调用。");
    add(27,"栈在（ ）中有所应用。",["A. 递归调用","B. 函数调用","C. 表达式求值","D. 前三个选项都有"],"D","三者均使用栈。");
    add(28,"为解决计算机主机与打印机间速度不匹配问题，通常设一个打印数据缓冲区。该缓冲区的逻辑结构应该是（ ）。",["A. 队列","B. 栈","C. 线性表","D. 有序表"],"A","先进先出队列。");
    add(29,"设栈S和队列Q初始为空，e1~e6依次进栈，出栈即入队，出队序列e2,e4,e3,e6,e5,e1，则栈S的容量至少应该是（ ）。",["A. 2","B. 3","C. 4","D. 6"],"B","模拟得最小容量3。");
    add(30,"若一个栈以向量V[1..n]存储，初始栈顶指针top设为n+1，则元素x进栈的正确操作是（ ）。",["A. top++; V[top]=x;","B. V[top]=x; top++;","C. top--; V[top]=x;","D. V[top]=x; top--;"],"C","高端栈顶。");
    add(31,"设计一个判别表达式左中右括号是否配对出现的算法，采用（ ）数据结构最佳。",["A. 线性表的顺序存储结构","B. 队列","C. 线性表的链式存储结构","D. 栈"],"D","栈经典应用。");
    add(32,"用链接方式存储的队列，在进行删除运算时（ ）。",["A. 仅修改头指针","B. 仅修改尾指针","C. 头、尾指针都要修改","D. 头、尾指针可能都要修改"],"D","若只剩一个元素，头尾均变。");

    add(102,"对n个关键字进行快速排序，在最坏情况下，算法的时间复杂度是（ ）。",["A. O(n)","B. O(n^2)","C. O(n log n)","D. O(n^3)"],"B","退化为O(n^2)。");
    add(103,"若一组记录的排序码为(46,79,56,38,40,84)，利用快速排序以第一个记录为基准得到的一次划分结果为（ ）。",["A. 38,40,46,56,79,84","B. 40,38,46,79,56,84","C. 40,38,46,56,79,84","D. 40,38,46,84,56,79"],"C","经典划分得C。");
    add(104,"下列关键字序列中，（ ）是堆。",["A. 16,72,31,23,94,53","B. 94,23,31,72,16,53","C. 16,53,23,94,31,72","D. 16,23,53,31,94,72"],"D","大根堆成立。");
    add(105,"堆是一种（ ）排序。",["A. 插入","B. 选择","C. 交换","D. 归并"],"B","堆排序是选择排序。");
    add(106,"堆的形状是一棵（ ）。",["A. 二叉排序树","B. 满二叉树","C. 完全二叉树","D. 平衡二叉树"],"C","完全二叉树。");
    add(107,"若一组记录的排序码为(46,79,56,38,40,84)，则利用堆排序建立的初始堆为（ ）。",["A. 79,46,56,38,40,84","B. 84,79,56,38,40,46","C. 84,79,56,46,40,38","D. 84,56,79,40,46,38"],"B","建堆结果B。");
    add(108,"下述几种排序方法中，要求内存最大的是（ ）。",["A. 希尔排序","B. 快速排序","C. 归并排序","D. 堆排序"],"C","归并需要O(n)额外空间。");
    add(109,"下述几种排序方法中，（ ）是稳定的排序方法。",["A. 希尔排序","B. 快速排序","C. 归并排序","D. 堆排序"],"C","归并排序稳定。");
    add(110,"数据表中有10000个元素，如果仅要求求出其中最大的10个元素，则采用（ ）算法最节省时间。",["A. 冒泡排序","B. 快速排序","C. 简单选择排序","D. 堆排序"],"D","堆排序部分取top K。");
    add(111,"下列排序算法中，不能保证每趟排序至少能将一个元素放到其最终的位置上的排序方法是（ ）。",["A. 希尔排序","B. 快速排序","C. 冒泡排序","D. 堆排序"],"A","希尔排序不稳定。");

    if(QUESTIONS.length !== 111) console.error("题目数量错误", QUESTIONS.length);
    document.getElementById("totalCount").innerText = QUESTIONS.length;

    // ------------------- 页面逻辑 -------------------
    let currentIdx = 0;
    let userAnswers = new Array(QUESTIONS.length).fill(null);
    let startTime = null;
    let timerInterval = null;

    const qTextSpan = document.getElementById("questionText");
    const optionsDiv = document.getElementById("optionsContainer");
    const explanationBox = document.getElementById("explanationBox");
    const graphContainer = document.getElementById("graphContainer");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const submitBtn = document.getElementById("submitBtn");
    const jumpBtn = document.getElementById("jumpBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const jumpModal = document.getElementById("jumpModal");
    const questionGrid = document.getElementById("questionGrid");
    const answeredSpan = document.getElementById("answeredCount");
    const correctSpan = document.getElementById("correctCount");
    const wrongSpan = document.getElementById("wrongCount");
    const timerSpan = document.getElementById("timerDisplay");
    const qIndexLabel = document.getElementById("qIndexLabel");
    const darkToggle = document.getElementById("darkModeToggle");

    function startTimerOnFirstAction() {
        if(startTime === null) {
            startTime = Date.now();
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(()=>{
                if(startTime) {
                    let elapsed = Math.floor((Date.now() - startTime)/1000);
                    let mins = Math.floor(elapsed/60);
                    let secs = elapsed % 60;
                    timerSpan.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                }
            }, 1000);
        }
    }

    function updateStatsUI() {
        let answered = userAnswers.filter(a => a !== null).length;
        let correct = 0, wrong = 0;
        for(let i=0;i<QUESTIONS.length;i++){
            if(userAnswers[i] !== null){
                if(userAnswers[i] === QUESTIONS[i].correct) correct++;
                else wrong++;
            }
        }
        answeredSpan.innerText = answered;
        correctSpan.innerText = correct;
        wrongSpan.innerText = wrong;
        if(jumpModal.classList.contains('active')) renderJumpGrid();
    }

    function renderCurrentQuestion() {
        const q = QUESTIONS[currentIdx];
        qTextSpan.innerText = `${currentIdx+1}. ${q.text}`;
        if(extraGraphs[q.id]) {
            graphContainer.style.display = "block";
            graphContainer.innerHTML = extraGraphs[q.id];
        } else {
            graphContainer.style.display = "none";
            graphContainer.innerHTML = "";
        }
        const selected = userAnswers[currentIdx];
        const isCorrectSelected = (selected === q.correct);
        const optsHtml = q.options.map((opt, idx) => {
            const letter = String.fromCharCode(65+idx);
            let highlightClass = "";
            if(selected === letter) {
                if(isCorrectSelected) highlightClass = "correct-highlight";
                else highlightClass = "wrong-highlight";
            }
            const optText = extractOptionText(opt);
            return `<div class="option-item ${highlightClass}" data-opt="${letter}">
                        <span class="option-prefix">${letter}</span>
                        <span>${optText}</span>
                    </div>`;
        }).join('');
        optionsDiv.innerHTML = optsHtml;
        if(selected !== null && selected !== q.correct){
            explanationBox.style.display = "block";
            explanationBox.innerHTML = `<div class="explanation-title">📖 正确答案：${q.correct}</div><div>${q.explanation}</div>`;
        } else {
            explanationBox.style.display = "none";
        }
        qIndexLabel.innerText = `第${currentIdx+1} / ${QUESTIONS.length}题`;
        document.querySelectorAll('.option-item').forEach(el => {
            el.addEventListener('click', (e) => {
                const chosenLetter = el.getAttribute('data-opt');
                if(userAnswers[currentIdx] !== null) return;
                if(startTime === null) startTimerOnFirstAction();
                userAnswers[currentIdx] = chosenLetter;
                updateStatsUI();
                renderCurrentQuestion();
                if(chosenLetter === QUESTIONS[currentIdx].correct && currentIdx+1 < QUESTIONS.length){
                    setTimeout(() => { currentIdx++; renderCurrentQuestion(); }, 280);
                }
            });
        });
    }

    function goPrev(){ if(currentIdx>0){ currentIdx--; renderCurrentQuestion(); } else alert("已是第一题"); }
    function goNext(){ if(currentIdx<QUESTIONS.length-1){ currentIdx++; renderCurrentQuestion(); } else alert("已是最后一题"); }
    function checkAllAnswered(){
        const unanswered = [];
        for(let i=0;i<QUESTIONS.length;i++) if(userAnswers[i]===null) unanswered.push(i+1);
        if(unanswered.length) alert(`还有 ${unanswered.length} 题未答: ${unanswered.join(',')}`);
        else alert(`🎉 恭喜完成！正确:${correctSpan.innerText} 错误:${wrongSpan.innerText}`);
    }

    function renderJumpGrid(){
        if(!questionGrid) return;
        questionGrid.innerHTML = "";
        for(let i=0;i<QUESTIONS.length;i++){
            const ans = userAnswers[i];
            let statusClass = "unanswered-status";
            if(ans !== null) {
                if(ans === QUESTIONS[i].correct) statusClass = "correct-status";
                else statusClass = "wrong-status";
            }
            const isCurrent = (i === currentIdx);
            const div = document.createElement("div");
            div.className = `grid-item ${statusClass} ${isCurrent ? 'current' : ''}`;
            div.innerText = i+1;
            div.addEventListener("click",()=>{
                currentIdx = i;
                renderCurrentQuestion();
                jumpModal.classList.remove("active");
            });
            questionGrid.appendChild(div);
        }
    }

    // 普通黑夜切换（无彩蛋）
    darkToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark");
        darkToggle.innerText = document.body.classList.contains("dark") ? "☀️ 白天" : "🌙 黑夜";
    });

    prevBtn.addEventListener("click", goPrev);
    nextBtn.addEventListener("click", goNext);
    submitBtn.addEventListener("click", checkAllAnswered);
    jumpBtn.addEventListener("click", ()=>{ renderJumpGrid(); jumpModal.classList.add("active"); });
    closeModalBtn.addEventListener("click", ()=> jumpModal.classList.remove("active"));
    jumpModal.addEventListener("click", (e)=>{ if(e.target === jumpModal) jumpModal.classList.remove("active"); });

    renderCurrentQuestion();
    updateStatsUI();
</script>
</body>
</html>
